name: Flutter CI

on:
  push:
    branches:
      - 'refactor/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  windows-regression:
    name: Windows regression smoke
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Test on Windows
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Native Windows smoke
        shell: pwsh
        run: ./tools/windows/smoke-windows.ps1

      - name: Verify installer contract
        shell: pwsh
        run: ./tools/windows/verify-installer.ps1

      - name: Verify updater contract
        shell: pwsh
        run: ./tools/windows/verify-updater.ps1

      - name: Install NSIS for packaging verification
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }

      - name: Build installer and update metadata locally in CI
        shell: pwsh
        run: ./tools/windows/package-update.ps1 -SkipFlutterBuild

      - name: Verify packaged installer
        shell: pwsh
        run: ./tools/windows/verify-installer.ps1 -RequireArtifacts

      - name: Verify packaged updater artifacts
        shell: pwsh
        run: ./tools/windows/verify-updater.ps1 -RequireArtifacts
