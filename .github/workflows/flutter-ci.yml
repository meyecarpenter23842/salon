name: Flutter CI

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify committed dependency lock
        shell: bash
        run: |
          if ! git diff --quiet -- pubspec.lock; then
            printf 'RESOLVED_LOCKFILE_BASE64='
            base64 -w0 pubspec.lock
            printf '\n'
            echo "::error::Commit the resolved pubspec.lock so local and CI share dependencies."
            exit 1
          fi

      - name: Generate TLS fixture for health integration
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/salon-health-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout "$RUNNER_TEMP/salon-health-tls/private-key.pem" \
            -out "$RUNNER_TEMP/salon-health-tls/certificate.pem" \
            -subj "/CN=Salon CI" -addext "subjectAltName=IP:127.0.0.1"
          echo "SALON_TEST_TLS_DIR=$RUNNER_TEMP/salon-health-tls" >> "$GITHUB_ENV"

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Upload mobile UI review renders
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-review
          path: build/mobile-ui-review/
          if-no-files-found: error
          retention-days: 14

  windows-regression:
    name: Windows regression smoke
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate TLS fixture for health integration
        shell: pwsh
        run: |
          $lanFixtureDirectory = Join-Path $env:RUNNER_TEMP 'salon-health-tls'
          ./tools/windows/setup-lan-health.ps1 -Address 127.0.0.1 -Directory $lanFixtureDirectory
          "SALON_TEST_TLS_DIR=$lanFixtureDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test on Windows
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Native Windows smoke
        shell: powershell
        run: ./tools/windows/smoke-windows.ps1

      - name: Verify installer contract
        shell: powershell
        run: ./tools/windows/verify-installer.ps1

      - name: Verify updater contract
        shell: powershell
        run: ./tools/windows/verify-updater.ps1

      - name: Install NSIS for packaging verification
        shell: powershell
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }

      - name: Build installer and update metadata locally in CI
        shell: powershell
        run: ./tools/windows/package-update.ps1 -SkipFlutterBuild

      - name: Verify packaged installer
        shell: powershell
        run: ./tools/windows/verify-installer.ps1 -RequireArtifacts

      - name: Verify packaged updater artifacts
        shell: powershell
        run: ./tools/windows/verify-updater.ps1 -RequireArtifacts

  android-build:
    name: Android companion APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build debug APK for companion testing
        run: flutter build apk --debug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: salon-companion-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
