name: Temp UI refine validation

on:
  push:
    branches:
      - 'refactor/v2-8-compact-detail-popups'

permissions:
  contents: read

jobs:
  validate-generated-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode patch script
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          src = pathlib.Path('tool/.ui_refine_patch.py.gz.b64').read_text().strip()
          pathlib.Path('/tmp/apply_ui_refine.py').write_bytes(gzip.decompress(base64.b64decode(src)))
          PY

      - name: Apply approved compact detail layout
        run: python3 /tmp/apply_ui_refine.py

      - name: Remove superseded detail widgets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def remove_until(text, start_marker, next_marker):
              start = text.index(start_marker)
              end = text.index(next_marker, start + len(start_marker))
              return text[:start] + text[end:]

          customer_path = Path('lib/features/customers/presentation/pages/customers_page.dart')
          customer = customer_path.read_text()
          customer = remove_until(
              customer,
              'class _CustomerMetricStrip extends StatelessWidget {',
              'class _InvoiceHistory extends StatelessWidget {',
          )
          customer_path.write_text(customer)

          employee_path = Path('lib/features/employees/presentation/pages/employees_page.dart')
          employee = employee_path.read_text()
          for start_marker, next_marker in [
              ('class _EmployeeOverviewTab extends StatelessWidget {', 'class _ProfileMetrics extends StatelessWidget {'),
              ('class _ProfileMetrics extends StatelessWidget {', 'class _EmployeeScheduleTab extends StatelessWidget {'),
              ('class _EmployeeScheduleTab extends StatelessWidget {', 'class _AppointmentProfileRow extends StatelessWidget {'),
              ('class _EmployeePerformanceTab extends StatelessWidget {', 'class _TopServiceRow extends StatelessWidget {'),
              ('class _TopServiceRow extends StatelessWidget {', 'class _EmployeeHistoryTab extends StatelessWidget {'),
              ('class _EmployeeHistoryTab extends StatelessWidget {', 'class _SectionLabel extends StatelessWidget {'),
              ('class _SectionLabel extends StatelessWidget {', 'class _InlineEmpty extends StatelessWidget {'),
              ('class _InlineEmpty extends StatelessWidget {', 'Color _statusTone(String status) {'),
          ]:
              employee = remove_until(employee, start_marker, next_marker)
          employee_path.write_text(employee)
          PY

      - name: Harden compact detail layout for desktop sizes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          employee_path = Path('lib/features/employees/presentation/pages/employees_page.dart')
          employee = employee_path.read_text()
          employee = employee.replace(
              'if (constraints.maxWidth < 900) {\n          return Column(',
              'if (constraints.maxWidth < 760) {\n          return Column(',
              1,
          )
          employee = employee.replace(
              "IconButton.outlined(\n                  tooltip: 'Sửa hồ sơ',",
              "IconButton.outlined(\n                  key: const Key('employee-profile-edit-action'),\n                  tooltip: 'Sửa hồ sơ',",
              1,
          )
          employee_path.write_text(employee)

          sales_path = Path('lib/features/sales/presentation/pages/sales_page.dart')
          sales = sales_path.read_text()
          sales = sales.replace(
              'Expanded(flex: 13, child: list),\n            const SizedBox(width: 10),\n            Expanded(flex: 7, child: detail),',
              'Expanded(flex: 11, child: list),\n            const SizedBox(width: 10),\n            Expanded(flex: 9, child: detail),',
              1,
          )
          sales_path.write_text(sales)

          test_path = Path('test/employee_profile_layout_test.dart')
          test = test_path.read_text()
          test = test.replace(
              "      expect(find.byKey(const Key('employee-profile-tabs')), findsOneWidget);\n      expect(\n        find.byKey(const Key('employee-profile-overview')),\n        findsOneWidget,\n      );",
              "      expect(find.byKey(const Key('employee-profile-card')), findsOneWidget);\n      expect(\n        find.byKey(const Key('employee-profile-edit-action')),\n        findsOneWidget,\n      );",
          )
          test = test.replace(
              "    await tester.tap(find.text('Sửa hồ sơ').first);",
              "    await tester.tap(\n      find.byKey(const Key('employee-profile-edit-action')),\n    );",
          )
          test_path.write_text(test)
          PY

      - name: Make employee insight cards height adaptive
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/employees/presentation/pages/employees_page.dart')
          text = path.read_text()

          def replace_block(text, start_marker, end_marker, replacement):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement + text[end:]

          next_card = r'''  Widget _nextAppointmentCard(
            BuildContext context,
            Map<String, Object?>? next,
            List<Map<String, Object?>> appointments,
          ) {
            return LayoutBuilder(
              builder: (context, constraints) {
                final compact = constraints.maxHeight < 96;
                if (compact) {
                  final summary = next == null
                      ? (profile['nextAppointmentLabel']?.toString() ??
                            'Chưa có lịch sắp tới')
                      : '${next['timeRange']?.toString() ?? ''} · ${next['customerName']?.toString() ?? 'Khách'} · ${next['serviceName']?.toString() ?? 'Dịch vụ'}';
                  return Container(
                    padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 6),
                    decoration: BoxDecoration(
                      color: AppColors.featureSurface,
                      borderRadius: BorderRadius.circular(12),
                      border: Border.all(color: AppColors.cardBorder),
                    ),
                    child: Row(
                      children: [
                        Icon(
                          Icons.event_available_outlined,
                          size: 16,
                          color: AppColors.copper,
                        ),
                        const SizedBox(width: 6),
                        Expanded(
                          child: Text(
                            'Lịch tiếp theo · $summary',
                            maxLines: 1,
                            overflow: TextOverflow.ellipsis,
                            style: const TextStyle(
                              fontWeight: FontWeight.w800,
                              fontSize: 10.5,
                            ),
                          ),
                        ),
                        if (appointments.isNotEmpty)
                          IconButton(
                            tooltip: 'Xem lịch',
                            onPressed: () => _showAppointments(context, appointments),
                            padding: EdgeInsets.zero,
                            constraints: const BoxConstraints.tightFor(
                              width: 28,
                              height: 28,
                            ),
                            icon: const Icon(Icons.open_in_new_rounded, size: 15),
                          ),
                      ],
                    ),
                  );
                }

                return Container(
                  padding: const EdgeInsets.all(12),
                  decoration: BoxDecoration(
                    color: AppColors.featureSurface,
                    borderRadius: BorderRadius.circular(12),
                    border: Border.all(color: AppColors.cardBorder),
                  ),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Row(
                        children: [
                          Icon(
                            Icons.event_available_outlined,
                            size: 18,
                            color: AppColors.copper,
                          ),
                          const SizedBox(width: 7),
                          const Expanded(
                            child: Text(
                              'Lịch tiếp theo',
                              style: TextStyle(fontWeight: FontWeight.w900),
                            ),
                          ),
                          TextButton(
                            onPressed: appointments.isEmpty
                                ? null
                                : () => _showAppointments(context, appointments),
                            child: const Text('Xem lịch'),
                          ),
                        ],
                      ),
                      const SizedBox(height: 8),
                      if (next == null)
                        Text(
                          profile['nextAppointmentLabel']?.toString() ??
                              'Chưa có lịch sắp tới.',
                          style: TextStyle(color: AppColors.textMuted),
                        )
                      else ...[
                        Text(
                          next['timeRange']?.toString() ?? '',
                          style: TextStyle(
                            color: AppColors.copper,
                            fontWeight: FontWeight.w900,
                            fontSize: 16,
                          ),
                        ),
                        const SizedBox(height: 5),
                        Text(
                          next['customerName']?.toString() ?? 'Khách',
                          maxLines: 1,
                          overflow: TextOverflow.ellipsis,
                          style: const TextStyle(fontWeight: FontWeight.w800),
                        ),
                        const SizedBox(height: 3),
                        Text(
                          next['serviceName']?.toString() ?? 'Dịch vụ',
                          maxLines: 1,
                          overflow: TextOverflow.ellipsis,
                          style: TextStyle(
                            color: AppColors.textMuted,
                            fontSize: 10.5,
                          ),
                        ),
                        const SizedBox(height: 7),
                        Align(
                          alignment: Alignment.centerLeft,
                          child: PremiumStatusPill(
                            label: next['status']?.toString() ?? '',
                            tone: _appointmentStatusTone(
                              next['status']?.toString() ?? '',
                            ),
                          ),
                        ),
                      ],
                    ],
                  ),
                );
              },
            );
          }

'''

          top_services = r'''  Widget _topServicesCard(List<Map<String, Object?>> services) {
            final rows = services.take(3).toList(growable: false);
            return LayoutBuilder(
              builder: (context, constraints) {
                final compact = constraints.maxHeight < 96;
                if (compact) {
                  final summary = rows.isEmpty
                      ? 'Chưa có dữ liệu'
                      : '${rows.first['title']?.toString() ?? 'Dịch vụ'} · ${_intValue(rows.first['quantity'])} lượt';
                  return Container(
                    padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 6),
                    decoration: BoxDecoration(
                      color: AppColors.featureSurface,
                      borderRadius: BorderRadius.circular(12),
                      border: Border.all(color: AppColors.cardBorder),
                    ),
                    child: Row(
                      children: [
                        Icon(
                          Icons.content_cut_rounded,
                          size: 16,
                          color: AppColors.copper,
                        ),
                        const SizedBox(width: 6),
                        Expanded(
                          child: Text(
                            'Top dịch vụ · $summary',
                            maxLines: 1,
                            overflow: TextOverflow.ellipsis,
                            style: const TextStyle(
                              fontWeight: FontWeight.w800,
                              fontSize: 10.5,
                            ),
                          ),
                        ),
                      ],
                    ),
                  );
                }

                return Container(
                  padding: const EdgeInsets.all(12),
                  decoration: BoxDecoration(
                    color: AppColors.featureSurface,
                    borderRadius: BorderRadius.circular(12),
                    border: Border.all(color: AppColors.cardBorder),
                  ),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Row(
                        children: [
                          Icon(
                            Icons.content_cut_rounded,
                            size: 18,
                            color: AppColors.copper,
                          ),
                          const SizedBox(width: 7),
                          const Expanded(
                            child: Text(
                              'Top dịch vụ tháng này',
                              style: TextStyle(fontWeight: FontWeight.w900),
                            ),
                          ),
                        ],
                      ),
                      const SizedBox(height: 8),
                      if (rows.isEmpty)
                        Text(
                          'Chưa có dữ liệu dịch vụ.',
                          style: TextStyle(
                            color: AppColors.textMuted,
                            fontSize: 10.5,
                          ),
                        )
                      else
                        for (var index = 0; index < rows.length; index++) ...[
                          Row(
                            children: [
                              SizedBox(
                                width: 24,
                                child: Text(
                                  '${index + 1}.',
                                  style: TextStyle(
                                    color: AppColors.copper,
                                    fontWeight: FontWeight.w900,
                                  ),
                                ),
                              ),
                              Expanded(
                                child: Text(
                                  rows[index]['title']?.toString() ?? 'Dịch vụ',
                                  maxLines: 1,
                                  overflow: TextOverflow.ellipsis,
                                ),
                              ),
                              Text(
                                '${_intValue(rows[index]['quantity'])} lượt',
                                style: TextStyle(
                                  color: AppColors.textMuted,
                                  fontSize: 10,
                                ),
                              ),
                            ],
                          ),
                          if (index < rows.length - 1)
                            const SizedBox(height: 6),
                        ],
                    ],
                  ),
                );
              },
            );
          }

'''

          text = replace_block(
              text,
              '  Widget _nextAppointmentCard(',
              '  Widget _topServicesCard(',
              next_card,
          )
          text = replace_block(
              text,
              '  Widget _topServicesCard(',
              '  Widget _historyCard(',
              top_services,
          )
          path.write_text(text)
          PY

      - name: Format affected files
        run: |
          dart format \
            lib/features/customers/presentation/pages/customers_page.dart \
            lib/features/services/presentation/pages/services_page.dart \
            lib/features/services/presentation/widgets/service_performance_panel.dart \
            lib/features/sales/presentation/pages/sales_page.dart \
            lib/features/sales/presentation/widgets/product_performance_panel.dart \
            lib/features/employees/presentation/pages/employees_page.dart \
            test/employee_profile_layout_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Save generated files
        if: always()
        run: |
          mkdir -p /tmp/ui-refine-artifact/lib/features/customers/presentation/pages
          mkdir -p /tmp/ui-refine-artifact/lib/features/services/presentation/pages
          mkdir -p /tmp/ui-refine-artifact/lib/features/services/presentation/widgets
          mkdir -p /tmp/ui-refine-artifact/lib/features/sales/presentation/pages
          mkdir -p /tmp/ui-refine-artifact/lib/features/sales/presentation/widgets
          mkdir -p /tmp/ui-refine-artifact/lib/features/employees/presentation/pages
          mkdir -p /tmp/ui-refine-artifact/test
          cp lib/features/customers/presentation/pages/customers_page.dart /tmp/ui-refine-artifact/lib/features/customers/presentation/pages/
          cp lib/features/services/presentation/pages/services_page.dart /tmp/ui-refine-artifact/lib/features/services/presentation/pages/
          cp lib/features/services/presentation/widgets/service_performance_panel.dart /tmp/ui-refine-artifact/lib/features/services/presentation/widgets/
          cp lib/features/sales/presentation/pages/sales_page.dart /tmp/ui-refine-artifact/lib/features/sales/presentation/pages/
          cp lib/features/sales/presentation/widgets/product_performance_panel.dart /tmp/ui-refine-artifact/lib/features/sales/presentation/widgets/
          cp lib/features/employees/presentation/pages/employees_page.dart /tmp/ui-refine-artifact/lib/features/employees/presentation/pages/
          cp test/employee_profile_layout_test.dart /tmp/ui-refine-artifact/test/
          git diff -- . ':!.github/workflows/_temp-ui-refine.yml' ':!tool/.ui_refine_patch.py.gz.b64' > /tmp/ui-refine-artifact/generated.patch

      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-detail-generated
          path: /tmp/ui-refine-artifact
          if-no-files-found: error
