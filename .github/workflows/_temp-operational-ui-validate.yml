name: Temp operational UI validation

on:
  push:
    branches:
      - 'automation/v2-8-operational-ui-validate'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply approved operational layout
        run: |
          python3 tool/.operational_ui_patch.py
          python3 tool/.operational_ui_lint_fix.py

      - name: Format affected files
        run: |
          dart format \
            lib/features/appointments/presentation/pages/appointments_page.dart \
            lib/features/appointments/presentation/pages/appointments_controls.dart \
            lib/features/appointments/presentation/pages/appointments_detail_sheet.dart \
            lib/features/invoices/presentation/pages/invoices_pos_page.dart \
            lib/features/invoices/presentation/pages/pos_bill_panel.dart \
            lib/features/invoices/presentation/pages/pos_checkout_panel.dart \
            test/operation_ui_batch_test.dart \
            test/invoices_pos_layout_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test full suite
        run: flutter test

      - name: Restore runner-only dependency changes
        run: git checkout -- pubspec.lock analysis_options.yaml || true

      - name: Stage validated product files
        run: |
          rm -rf /tmp/operational-ui-product
          mkdir -p /tmp/operational-ui-product/lib/features/appointments/presentation/pages
          mkdir -p /tmp/operational-ui-product/lib/features/invoices/presentation/pages
          mkdir -p /tmp/operational-ui-product/test
          cp lib/features/appointments/presentation/pages/appointments_page.dart /tmp/operational-ui-product/lib/features/appointments/presentation/pages/
          cp lib/features/appointments/presentation/pages/appointments_controls.dart /tmp/operational-ui-product/lib/features/appointments/presentation/pages/
          cp lib/features/appointments/presentation/pages/appointments_detail_sheet.dart /tmp/operational-ui-product/lib/features/appointments/presentation/pages/
          cp lib/features/invoices/presentation/pages/invoices_pos_page.dart /tmp/operational-ui-product/lib/features/invoices/presentation/pages/
          cp lib/features/invoices/presentation/pages/pos_bill_panel.dart /tmp/operational-ui-product/lib/features/invoices/presentation/pages/
          cp lib/features/invoices/presentation/pages/pos_checkout_panel.dart /tmp/operational-ui-product/lib/features/invoices/presentation/pages/
          cp test/operation_ui_batch_test.dart /tmp/operational-ui-product/test/
          cp test/invoices_pos_layout_test.dart /tmp/operational-ui-product/test/

      - name: Publish one clean product commit
        run: |
          git fetch origin main refactor/v2-8-operational-workspaces
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B refactor/v2-8-operational-workspaces origin/main
          cp /tmp/operational-ui-product/lib/features/appointments/presentation/pages/*.dart lib/features/appointments/presentation/pages/
          cp /tmp/operational-ui-product/lib/features/invoices/presentation/pages/*.dart lib/features/invoices/presentation/pages/
          cp /tmp/operational-ui-product/test/*.dart test/
          git add \
            lib/features/appointments/presentation/pages/appointments_page.dart \
            lib/features/appointments/presentation/pages/appointments_controls.dart \
            lib/features/appointments/presentation/pages/appointments_detail_sheet.dart \
            lib/features/invoices/presentation/pages/invoices_pos_page.dart \
            lib/features/invoices/presentation/pages/pos_bill_panel.dart \
            lib/features/invoices/presentation/pages/pos_checkout_panel.dart \
            test/operation_ui_batch_test.dart \
            test/invoices_pos_layout_test.dart
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 8
          git commit -m "refactor(ui): compact appointments and billing workspaces"
          git push origin HEAD:refs/heads/refactor/v2-8-operational-workspaces

      - name: Verify published scope
        if: always()
        run: |
          git status --short
